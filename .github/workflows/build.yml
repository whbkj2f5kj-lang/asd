name: APK bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK bauen
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log

      - name: Fehler zusammenfassen
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong|Could not|^> [^T]|Caused by|^w: " build.log | head -80 > errors.txt || true
          [ -s errors.txt ] || tail -60 build.log > errors.txt
          msg=$(sed -e 's/%/%25/g' errors.txt | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build-Fehler::$msg"

      - uses: actions/upload-artifact@v4
        with:
          name: DashboardW204-apk
          path: app/build/outputs/apk/debug/*.apk
