name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK bauen
        shell: bash
        run: |
          set -o pipefail
          gradle testDebugUnitTest --tests 'de.jarvis.w204.ObdParserTest' --tests 'de.jarvis.w204.VisionTest' --tests 'de.jarvis.w204.DiagTest' --tests 'de.jarvis.w204.DtcTest' assembleDebug --console=plain -Pabis=arm64-v8a,armeabi-v7a 2>&1 | tee build.log

      - name: Fehler zusammenfassen
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong|Could not|^> [^T]|Caused by|FAILED|Error|expected|tests completed" build.log | head -80 > errors.txt || true
          [ -s errors.txt ] || tail -60 build.log > errors.txt
          msg=$(sed -e 's/%/%25/g' errors.txt | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build-Fehler::$msg"

      - uses: actions/upload-artifact@v4
        with:
          name: DashboardW204-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Als Download veröffentlichen
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          cp app/build/outputs/apk/debug/app-debug.apk DashboardW204.apk
          gradle assembleDebug --console=plain -Pabis=x86_64,x86
          cp app/build/outputs/apk/debug/app-debug.apk DashboardW204-PC.apk
          # Vorschaubilder der Oberfläche (Paparazzi) – Fehler hier stoppen die Veröffentlichung nicht
          if gradle recordPaparazziDebug --console=plain > paparazzi.log 2>&1; then
            i=0; for f in app/src/test/snapshots/images/*.png; do
              n=$(basename "$f" .png | sed 's/.*ScreenshotTest_//'); cp "$f" "vorschau_$n.png"; done
          else
            msg=$(grep -E "^e: |error|Exception|FAILED|What went wrong" paparazzi.log | head -40 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::warning title=Vorschau fehlgeschlagen::$msg"
          fi
          gh release delete neueste --yes --cleanup-tag || true
          gh release create neueste DashboardW204.apk DashboardW204-PC.apk vorschau_*.png --title "Dashboard W204 (neueste Version)" --notes "DashboardW204.apk = fürs Radio. DashboardW204-PC.apk = für BlueStacks/Emulator. Gebaut aus ${GITHUB_SHA::7}."
